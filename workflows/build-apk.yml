# ============================================================
#  ملف بناء APK تلقائي — GitHub Actions
#  طريقة التفعيل (مرة واحدة فقط):
#    انقل هذا الملف إلى:  .github/workflows/build-apk.yml
#    ثم ادفعه إلى المستودع (git push).
#  بعدها كل ما تدفع تعديلاً على فرع main، أو تضغط
#  "Run workflow" من تبويب Actions، سيُبنى الـ APK
#  وستجده في: Actions ← Build APK ← Artifacts
# ============================================================
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (اختياري - يكتشف الأخطاء)
        run: flutter analyze || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dokkan-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
